apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordcapture
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordcapture
  template:
    metadata:
      labels:
        app: wordcapture
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: wordcapture
          image: ghcr.io/zlobur/wordcapture:bc61c0bda5a6d73c7b9a2ac2cf48c4059e72dd8e
          ports:
            - containerPort: 80
          env:
            - name: Telegram__BotToken
              valueFrom:
                secretKeyRef:
                  name: wordcapture-secrets
                  key: telegram-bot-token
            - name: DeepLKey
              valueFrom:
                secretKeyRef:
                  name: wordcapture-secrets
                  key: deepl-key
            - name: Grok__ApiKey
              valueFrom:
                secretKeyRef:
                  name: wordcapture-secrets
                  key: grok-api-key
---
apiVersion: v1
kind: Service
metadata:
  name: wordcapture
spec:
  selector:
    app: wordcapture
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wordcapture
spec:
  ingressClassName: nginx
  rules:
    - host: wordcapture.app.zlobur.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wordcapture
                port:
                  number: 80
