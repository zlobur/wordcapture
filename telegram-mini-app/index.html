<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WordCapture</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap');

    :root {
      --bg: #111214;
      --surface: #1c1e22;
      --surface2: #242628;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.25);
      --accent-dim: rgba(59, 130, 246, 0.12);
      --green: #22c55e;
      --green-dim: rgba(34, 197, 94, 0.12);
      --red: #ef4444;
      --red-dim: rgba(239, 68, 68, 0.12);
      --text: #f1f3f5;
      --text-sub: #6b7280;
      --text-muted: #374151;
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'PT Serif', serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    .header {
      padding: 16px 20px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .close-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--surface2);
      border: none;
      color: var(--text-sub);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .close-btn:active {
      background: var(--surface);
    }

    .progress-wrap {
      flex: 1;
      margin: 0 12px;
    }

    .progress-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
      text-align: center;
      margin-bottom: 6px;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.05em;
    }

    .progress-bar {
      height: 4px;
      background: var(--surface2);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 8px var(--accent-glow);
    }

    .deck-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 20px;
      position: relative;
    }

    .card-stack {
      position: relative;
      width: 100%;
      max-width: 380px;
      height: 320px;
    }

    .card-behind {
      position: absolute;
      inset: 0;
      background: var(--surface2);
      border-radius: var(--radius);
      transform: scale(0.94) translateY(10px);
      opacity: 0.5;
    }

    .card-behind-2 {
      position: absolute;
      inset: 0;
      background: var(--surface);
      border-radius: var(--radius);
      transform: scale(0.97) translateY(5px);
      opacity: 0.7;
    }

    .card {
      position: absolute;
      inset: 0;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 28px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      touch-action: pan-y;
      will-change: transform;
    }

    .card:active {
      transform: scale(0.98);
    }

    .card.revealed {
      border-color: rgba(59, 130, 246, 0.2);
      box-shadow: 0 0 32px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .card.fly-left {
      animation: flyLeft 0.4s cubic-bezier(0.4, 0, 1, 1) forwards;
    }

    .card.fly-right {
      animation: flyRight 0.4s cubic-bezier(0.4, 0, 1, 1) forwards;
    }

    @keyframes flyLeft {
      to {
        transform: translateX(-140%) rotate(-12deg);
        opacity: 0;
      }
    }

    @keyframes flyRight {
      to {
        transform: translateX(140%) rotate(12deg);
        opacity: 0;
      }
    }

    .card-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-dim);
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 24px;
    }

    .card-word {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-align: center;
      line-height: 1.1;
      margin-bottom: 12px;
    }

    .card-transcription {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      color: var(--text-sub);
      margin-bottom: 0;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .card-translation {
      font-size: 22px;
      font-weight: 600;
      color: var(--accent);
      margin-top: 20px;
      text-align: center;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.35s ease 0.05s, transform 0.35s ease 0.05s;
    }

    .card.revealed .card-transcription,
    .card.revealed .card-translation {
      opacity: 1;
      transform: translateY(0);
    }

    .tap-hint {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 28px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.3s;
    }

    .card.revealed .tap-hint {
      opacity: 0;
      pointer-events: none;
    }

    .swipe-indicators {
      position: absolute;
      inset: 0;
      border-radius: var(--radius);
      pointer-events: none;
      overflow: hidden;
    }

    .indicator-know {
      position: absolute;
      top: 20px;
      right: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--green);
      background: var(--green-dim);
      padding: 6px 14px;
      border-radius: 8px;
      border: 1.5px solid var(--green);
      opacity: 0;
      transform: rotate(8deg);
      transition: opacity 0.1s;
    }

    .indicator-skip {
      position: absolute;
      top: 20px;
      left: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--red);
      background: var(--red-dim);
      padding: 6px 14px;
      border-radius: 8px;
      border: 1.5px solid var(--red);
      opacity: 0;
      transform: rotate(-8deg);
      transition: opacity 0.1s;
    }

    .actions {
      padding: 0 20px 32px;
      display: flex;
      gap: 12px;
    }

    .btn {
      flex: 1;
      height: 58px;
      border: none;
      border-radius: 16px;
      font-family: 'PT Serif', serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.12s ease;
      letter-spacing: 0.01em;
    }

    .btn:active {
      transform: scale(0.96);
      opacity: 0.9;
    }

    .btn-skip {
      background: var(--red-dim);
      color: var(--red);
      border: 1.5px solid rgba(239, 68, 68, 0.25);
    }

    .btn-know {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .btn-show {
      width: 100%;
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .actions.pre-reveal {
      padding: 0 20px 32px;
    }

    .actions.pre-reveal .btn-skip,
    .actions.pre-reveal .btn-know {
      display: none;
    }

    .actions.post-reveal .btn-show {
      display: none;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 40px 20px;
    }

    .empty-icon {
      font-size: 56px;
      filter: grayscale(0.2);
    }

    .empty-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .empty-sub {
      font-size: 15px;
      color: var(--text-sub);
      text-align: center;
      line-height: 1.5;
    }

    .stats-row {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }

    .stat-box {
      flex: 1;
      background: var(--surface);
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-num {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .stat-num.green {
      color: var(--green);
    }

    .stat-num.red {
      color: var(--red);
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 2px;
      font-family: 'JetBrains Mono', monospace;
    }

    .btn-restart {
      margin-top: 8px;
      padding: 14px 32px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-family: 'PT Serif', serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 20px var(--accent-glow);
      transition: transform 0.12s;
    }

    .btn-restart:active {
      transform: scale(0.96);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <div id="main">
    <div class="header">
      <button class="close-btn" onclick="Telegram.WebApp.close()">✕</button>
      <div class="progress-wrap">
        <div class="progress-label" id="progress-label">0 / 0</div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill" style="width:0%"></div>
        </div>
      </div>
      <div style="width:36px"></div>
    </div>

    <div class="deck-area">
      <div class="card-stack" id="card-stack">
        <div class="card-behind"></div>
        <div class="card-behind-2"></div>
        <div class="card" id="card" onclick="handleCardClick()">
          <div class="swipe-indicators">
            <div class="indicator-know" id="ind-know">ЗНАЮ</div>
            <div class="indicator-skip" id="ind-skip">ЕЩЁ РАЗ</div>
          </div>
          <div class="card-tag" id="card-tag">noun</div>
          <div class="card-word" id="card-word">—</div>
          <div class="card-transcription" id="card-transcription">/trænsˈkrɪpʃn/</div>
          <div class="card-translation" id="card-translation">перевод</div>
          <div class="tap-hint">нажми чтобы показать ответ</div>
        </div>
      </div>
    </div>

    <div class="actions post-reveal hidden" id="actions-post">
      <button class="btn btn-skip" onclick="answer(false)">Ещё раз</button>
      <button class="btn btn-know" onclick="answer(true)">Знаю ✓</button>
    </div>
    <div class="actions pre-reveal" id="actions-pre">
      <button class="btn btn-show" onclick="reveal()">Показать ответ</button>
    </div>
  </div>

  <div class="empty-state hidden" id="done-screen">
    <div class="empty-icon">🎯</div>
    <div class="empty-title">Готово!</div>
    <div class="empty-sub">Ты прошёл все карточки</div>
    <div class="stats-row" id="stats-row"></div>
    <button class="btn-restart" onclick="restart()">Повторить снова</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const CARDS = [
      { word: "leverage", transcription: "/ˈlevərɪdʒ/", translation: "рычаг, использовать", tag: "verb" },
      { word: "resilient", transcription: "/rɪˈzɪliənt/", translation: "устойчивый, гибкий", tag: "adj" },
      { word: "hand on", transcription: "/hænd ɒn/", translation: "передавать, снабжать", tag: "phrasal verb" },
      { word: "mitigate", transcription: "/ˈmɪtɪɡeɪt/", translation: "смягчать, снижать", tag: "verb" },
      { word: "nuance", transcription: "/ˈnjuːɑːns/", translation: "нюанс, тонкость", tag: "noun" },
      { word: "prevail", transcription: "/prɪˈveɪl/", translation: "преобладать, побеждать", tag: "verb" },
      { word: "onset", transcription: "/ˈɒnset/", translation: "начало, наступление", tag: "noun" },
    ];

    let queue = [];
    let current = 0;
    let known = 0;
    let skipped = 0;
    let revealed = false;

    let touchStartX = 0;
    let touchStartY = 0;
    let isDragging = false;

    async function init() {
      try {
        const res = await fetch('/cards');
        const cards = await res.json();
        queue = cards.map(c => ({ word: c.original, translation: c.translation, transcription: '', tag: '' }));
      } catch {
        queue = [];
      }
      current = 0; known = 0; skipped = 0;
      showCard();
    }

    function showCard() {
      if (current >= queue.length) { showDone(); return; }
      const c = queue[current];
      document.getElementById('card-word').textContent = c.word;
      document.getElementById('card-transcription').textContent = c.transcription;
      document.getElementById('card-translation').textContent = c.translation;
      document.getElementById('card-tag').textContent = c.tag;

      const card = document.getElementById('card');
      card.classList.remove('revealed', 'fly-left', 'fly-right');
      card.style.transform = '';
      card.style.opacity = '';

      document.getElementById('ind-know').style.opacity = '0';
      document.getElementById('ind-skip').style.opacity = '0';

      document.getElementById('actions-pre').classList.remove('hidden');
      document.getElementById('actions-post').classList.add('hidden');

      revealed = false;
      updateProgress();
    }

    function updateProgress() {
      const total = queue.length;
      const done = current;
      document.getElementById('progress-label').textContent = `${done} / ${total}`;
      document.getElementById('progress-fill').style.width = `${(done / total) * 100}%`;
    }

    function handleCardClick() {
      if (!revealed) reveal();
    }

    function reveal() {
      revealed = true;
      document.getElementById('card').classList.add('revealed');
      document.getElementById('actions-pre').classList.add('hidden');
      document.getElementById('actions-post').classList.remove('hidden');
    }

    function answer(isKnown) {
      if (isKnown) { known++; flyCard('right'); }
      else { skipped++; flyCard('left'); }
    }

    function flyCard(dir) {
      const card = document.getElementById('card');
      card.classList.add(dir === 'right' ? 'fly-right' : 'fly-left');
      setTimeout(() => { current++; showCard(); }, 380);
    }

    function showDone() {
      document.getElementById('main').classList.add('hidden');
      const done = document.getElementById('done-screen');
      done.classList.remove('hidden');
      document.getElementById('stats-row').innerHTML = `
      <div class="stat-box">
        <div class="stat-num green">${known}</div>
        <div class="stat-label">знаю</div>
      </div>
      <div class="stat-box">
        <div class="stat-num red">${skipped}</div>
        <div class="stat-label">ещё раз</div>
      </div>
    `;
    }

    function restart() {
      document.getElementById('done-screen').classList.add('hidden');
      document.getElementById('main').classList.remove('hidden');
      init();
    }

    const card = document.getElementById('card');
    card.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      isDragging = false;
    }, { passive: true });

    card.addEventListener('touchmove', e => {
      if (!revealed) return;
      const dx = e.touches[0].clientX - touchStartX;
      const dy = e.touches[0].clientY - touchStartY;
      if (!isDragging && Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 8) isDragging = true;
      if (!isDragging) return;
      const rotate = dx * 0.08;
      card.style.transform = `translateX(${dx}px) rotate(${rotate}deg)`;
      card.style.transition = 'none';
      const threshold = 60;
      document.getElementById('ind-know').style.opacity = dx > threshold ? Math.min((dx - threshold) / 60, 1) : '0';
      document.getElementById('ind-skip').style.opacity = dx < -threshold ? Math.min((-dx - threshold) / 60, 1) : '0';
    }, { passive: true });

    card.addEventListener('touchend', e => {
      if (!revealed || !isDragging) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      card.style.transition = '';
      if (dx > 80) answer(true);
      else if (dx < -80) answer(false);
      else {
        card.style.transform = '';
        document.getElementById('ind-know').style.opacity = '0';
        document.getElementById('ind-skip').style.opacity = '0';
      }
      isDragging = false;
    }, { passive: true });

    init();
  </script>
</body>

</html>
