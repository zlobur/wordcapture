<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 260px;
            padding: 16px;
            font-family: system-ui, sans-serif;
            font-size: 14px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            color: white;
        }

        .btn-tg {
            background: #0088cc;
        }

        .btn-unlink {
            background: #ef4444;
        }

        .status {
            color: #666;
            margin-bottom: 8px;
        }

        .id {
            font-family: monospace;
            font-size: 11px;
            color: #999;
            margin-top: 12px;
            word-break: break-all;
        }
    </style>
</head>

<body>
    <div class="status" id="status"></div>
    <button class="btn btn-tg" id="linkBtn">Подключить Telegram</button>
    <button class="btn btn-unlink" id="unlinkBtn">Отвязать аккаунт</button>
    <div class="id" id="extId"></div>
    <script src="popup.js"></script>
</body>

</html>
